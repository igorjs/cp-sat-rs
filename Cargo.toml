[workspace]
resolver = "3"
members = ["crates/difftest", "crates/proto", "xtask"]
exclude = ["xtask/tests/fixtures"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[profile.release]
overflow-checks = true

[workspace.dependencies]
cxx = "=1.0.205"
cxx-build = "=1.0.205"
prost = "=0.14.4"
prost-build = "=0.14.4"
protox = "=0.10.0"
sha2 = "=0.10.9"
