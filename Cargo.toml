[workspace]
resolver = "3"
members = ["crates/base", "crates/difftest", "crates/port", "crates/proto", "crates/sat", "crates/testutil", "crates/util", "xtask"]
exclude = ["xtask/tests/fixtures"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[profile.release]
overflow-checks = true

[workspace.dependencies]
cxx = "=1.0.205"
cxx-build = "=1.0.205"
log = "=0.4.35"
prost = "=0.14.4"
prost-build = "=0.14.4"
prost-reflect = { version = "=0.16.5", features = ["text-format"] }
rand_chacha = "=0.9.0"
protox = "=0.10.0"
sha2 = "=0.10.9"
