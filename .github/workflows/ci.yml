name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cargo fails on a workspace with no member, so each cargo step runs only once
# a crate exists.
env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt
      - if: hashFiles('crates/*/Cargo.toml', 'xtask/Cargo.toml') != ''
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: hashFiles('crates/*/Cargo.toml', 'xtask/Cargo.toml') != ''
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: hashFiles('crates/*/Cargo.toml', 'xtask/Cargo.toml') != ''
        run: cargo test --workspace
      - if: hashFiles('crates/*/Cargo.toml', 'xtask/Cargo.toml') != ''
        run: cargo test --workspace --release
      # The counts check reads the base branch of a pull request, so that branch is fetched.
      - if: github.base_ref != ''
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - if: hashFiles('crates/*/Cargo.toml', 'xtask/Cargo.toml') != ''
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base_args=()
          if [ -n "${BASE_REF}" ]; then
            base_args=(--base "origin/${BASE_REF}")
          fi
          cargo xtask port-map --check "${base_args[@]}"
          cargo xtask port-map --check --release "${base_args[@]}"
      - if: hashFiles('crates/*/Cargo.toml', 'xtask/Cargo.toml') != ''
        run: scripts/check-red.sh

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: hashFiles('crates/*/Cargo.toml', 'xtask/Cargo.toml') != ''
        # rust-toolchain.toml overrides the default, so name the toolchain.
        run: cargo +1.88 build --workspace

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('crates/*/Cargo.toml', 'xtask/Cargo.toml') != ''
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      # The active toolchain is the one rust-toolchain.toml pins.
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: hashFiles('crates/*/Cargo.toml', 'xtask/Cargo.toml') != ''
        run: cargo llvm-cov --workspace --fail-under-lines "$(cat coverage-floor.txt)"

  # Builds OR-Tools at the pinned commit. A pull request cannot read a cache
  # another pull request saved, so this job also runs on main, whose cache every
  # pull request can read.
  # The runner image is pinned because the cached library links against its
  # system libraries.
  reference:
    runs-on: ubuntu-24.04
    # Twice the measured build time of 17 minutes.
    timeout-minutes: 35
    env:
      REFERENCE_PREFIX: ${{ github.workspace }}/.reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/fetch-upstream.sh
      - id: reference-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .reference
          key: reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock', 'scripts/build-reference.sh') }}
      - if: steps.reference-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install --yes libbz2-dev
      - run: scripts/build-reference.sh
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - if: hashFiles('xtask/Cargo.toml') != ''
        run: cargo xtask port-map --check --upstream
      - if: hashFiles('xtask/Cargo.toml') != ''
        run: cargo xtask port-map
      - if: hashFiles('xtask/Cargo.toml') != ''
        run: git diff --exit-code docs/port-map.md
      - if: hashFiles('crates/difftest/Cargo.toml') != ''
        run: cargo test -p cpsat-difftest --features reference -j 4
      - if: hashFiles('crates/difftest/Cargo.toml') != ''
        run: cargo run -p cpsat-difftest --features reference --bin capture -j 4 -- --check
      # On a manual run, prints a fixture for each input file, named
      # crates/*/tests/fixtures/inputs/<kind>.<name>.in, to copy into a fixture.
      - if: github.event_name == 'workflow_dispatch' && hashFiles('crates/difftest/Cargo.toml') != ''
        run: |
          for file in crates/*/tests/fixtures/inputs/*.in; do
            [ -e "$file" ] || continue
            kind=$(basename "$file"); kind=${kind%%.*}
            echo "::group::$file"
            cargo run -q -p cpsat-difftest --features reference --bin capture -j 4 -- "$kind" "$file"
            echo "::endgroup::"
          done
      # Saves a finished build even when a step after the build fails.
      - if: always() && steps.reference-cache.outputs.cache-hit != 'true' && hashFiles('.reference/.reference-commit') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .reference
          key: ${{ steps.reference-cache.outputs.cache-primary-key }}

  # Runs the Rust parser, printer, validation and solution check against the
  # reference on the models of the upstream tests. It restores the prefix that
  # the reference job saved and never builds one.
  difftest:
    needs: reference
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REFERENCE_PREFIX: ${{ github.workspace }}/.reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/fetch-upstream.sh
      - id: reference-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .reference
          key: reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock', 'scripts/build-reference.sh') }}
      - if: steps.reference-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::The reference build is not in the cache. Run the reference job, which builds and saves it, then run this job again."
          exit 1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo run --release -p cpsat-difftest --features reference --bin difftest -j 4
