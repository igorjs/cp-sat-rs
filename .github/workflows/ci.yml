name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cargo fails on a workspace with no member, so each cargo step runs only once
# a crate exists.
env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt
      - if: hashFiles('crates/*/Cargo.toml', 'xtask/Cargo.toml') != ''
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: hashFiles('crates/*/Cargo.toml', 'xtask/Cargo.toml') != ''
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: hashFiles('crates/*/Cargo.toml', 'xtask/Cargo.toml') != ''
        run: cargo test --workspace
      - if: hashFiles('crates/*/Cargo.toml', 'xtask/Cargo.toml') != ''
        run: cargo test --workspace --release

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: hashFiles('crates/*/Cargo.toml', 'xtask/Cargo.toml') != ''
        # rust-toolchain.toml overrides the default, so name the toolchain.
        run: cargo +1.88 build --workspace

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('crates/*/Cargo.toml', 'xtask/Cargo.toml') != ''
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      # The active toolchain is the one rust-toolchain.toml pins.
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: hashFiles('crates/*/Cargo.toml', 'xtask/Cargo.toml') != ''
        run: cargo llvm-cov --workspace --fail-under-lines "$(cat coverage-floor.txt)"

  # Builds OR-Tools at the pinned commit. A pull request cannot read a cache
  # another pull request saved, so this job also runs on main, whose cache every
  # pull request can read.
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REFERENCE_PREFIX: ${{ github.workspace }}/.reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/fetch-upstream.sh
      - id: reference-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .reference
          key: reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock', 'scripts/build-reference.sh') }}
      - run: scripts/build-reference.sh
      # Placed straight after the build, and run even when a later step fails,
      # so one finished build is never built twice.
      - if: always() && steps.reference-cache.outputs.cache-hit != 'true' && hashFiles('.reference/.reference-commit') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .reference
          key: ${{ steps.reference-cache.outputs.cache-primary-key }}
